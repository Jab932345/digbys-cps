/* ── One product list for the picker ──────────────────────────────────── */
let _cpCache=null,_cpKey=null;
function customProducts(){
  const key=[S.cps.products,S.kp.at,S.cps.products.length];
  if(_cpCache&&_cpKey&&_cpKey.every((v,i)=>v===key[i]))return _cpCache;
  _cpKey=key;
  return _cpCache=S.cps.products.filter(p=>p.category!==CONTAINER&&!kpCopyKind(p)).map(customFromRow);
}
function customFromRow(p){
  return{key:'cps:'+p.id,src:'custom',id:p.id,name:String(p.name||'').trim(),cat:p.category||'Other',section:CAT_SECTION[p.category]||'',
    contains:alList(p.contains),may:alList(p.may_contain).filter(x=>!alList(p.contains).includes(x)),
    shelfHours:parseInt(p.shelf_life_hours)||72,frozen:false,row:p};
}
function oldKpCopies(){return S.cps.products.filter(p=>p.category!==CONTAINER&&kpCopyKind(p)==='old');}
/* Made before CPS 3 (no mark), or looks like a Kitchen Prep freezer copy: a manager checks each once. */
function uncheckedProducts(){return S.cps.products.filter(p=>p.category!==CONTAINER&&p.menu_type!==CUSTOM_MARK&&(kpCopyKind(p)===null||kpCopyKind(p)==='maybe'));}
/* A product row, written with its mark — without it if this database has no such column. */
async function saveProductRow(method,path,body){
  try{return await rest(CPS,method,path,body,{prefer:'return=minimal'});}
  catch(e){if(!e.offline&&'menu_type'in body&&(isColumnError(e)||/22P02|42804|malformed array/i.test((e.code||'')+' '+e.message))){const{menu_type,...rest2}=body;return await rest(CPS,method,path,rest2,{prefer:'return=minimal'});}throw e;}
}
function rowForInsert(r){const{id,created_at,updated_at,...rest}=r;return rest;}
function containers(){return S.cps.products.filter(p=>p.category===CONTAINER).map(p=>({id:p.id,name:String(p.name||'').trim(),contains:alList(p.contains),may:alList(p.may_contain),row:p})).sort((a,b)=>a.name.localeCompare(b.name));}
function allProducts(){return[...S.kp.products,...customProducts()];}
function productByKey(k){return allProducts().find(p=>p.key===k)||null;}
function productByName(name){const n=norm(name);return S.kp.products.find(p=>norm(p.name)===n)||customProducts().find(p=>norm(p.name)===n)||null;}
function oneOff(name,contains=[],may=[]){return{key:'one:'+norm(name),src:'oneoff',name:String(name).trim(),cat:'One-off',section:'',contains,may,shelfHours:chilledDays()*24,frozen:false};}

/* ── Jobs: Kitchen Prep events first, then CPS-only codes ─────────────── */
function kpEvents(daysBack=3){
  const from=addDays(ymd(),-daysBack);
  return S.kp.events.filter(e=>e.status!=='Cancelled'&&e.event_date>=from).sort((a,b)=>(a.event_date+a.start_time).localeCompare(b.event_date+b.start_time));
}
function evJob(e){return{code:e.job_code,client:e.client_name||'Event',date:e.event_date,covers:e.covers,status:e.status,type:e.event_type,venue:e.venue_name,ev:e,src:'kp'};}
function kpJobs(){const seen=new Set();return kpEvents().filter(e=>e.job_code&&!seen.has(e.job_code)&&seen.add(e.job_code)).map(evJob);}
function allKpCodes(){return new Set(S.kp.events.map(e=>e.job_code).filter(Boolean));}
function codeDate(code){const m=/(\d{2})(\d{2})(\d{2})[A-Z]*$/.exec(String(code||''));if(!m)return null;const d=`20${m[3]}-${m[2]}-${m[1]}`;return isYmd(d)&&parseYmd(d).getDate()===+m[1]?d:null;}
function customJobs({current}={}){
  const kp=allKpCodes(),cut=addDays(ymd(),-7);
  return S.cps.jobs.filter(j=>j.code&&!kp.has(String(j.code).toUpperCase().trim())).map(j=>({code:String(j.code).toUpperCase().trim(),client:j.description||'',date:codeDate(j.code),src:'cps',id:j.id,row:j}))
    .filter(j=>!current||!j.date||j.date>=cut);
}
function jobByCode(code){if(!code)return null;const c=String(code).toUpperCase().trim();const ev=S.kp.events.find(e=>e.job_code===c);if(ev)return evJob(ev);const j=customJobs().find(x=>x.code===c);return j||{code:c,client:'',src:'unknown'};}
function eventsWithDish(dishId){if(!dishId)return[];return kpJobs().filter(j=>j.date>=ymd()&&j.ev.dishes.some(d=>d.dish_id===dishId));}
function menuProducts(job){
  if(!job||!job.ev)return[];
  const out=[];
  job.ev.dishes.forEach(ed=>{S.kp.products.filter(p=>p.dishId===ed.dish_id).forEach(p=>out.push({p,portions:ed.portions}));});
  return out;
}

/* ── Sent from Kitchen Prep: print_jobs rows it wrote to be printed here
      (label_status FRIDGE / FREEZER — the brine labels, stock labels). ── */
async function loadInbox(){
  const since=new Date(Date.now()-3*86400e3).toISOString();
  try{
    const rows=await rest(CPS,'GET',`print_jobs?select=*&label_status=in.(FRIDGE,FREEZER)&created_at=gte.${encodeURIComponent(since)}&order=created_at.asc&limit=100`);
    const done=new Set(LS.get('dcps_inbox_done',[]));
    S.inbox=(rows||[]).filter(r=>!done.has(String(r.id)));
    // anything printed here whose status couldn't be updated at the time: try again
    const stale=(rows||[]).filter(r=>done.has(String(r.id)));
    stale.forEach(r=>rest(CPS,'PATCH','print_jobs?id=eq.'+encodeURIComponent(r.id),{label_status:r.label_status==='FREEZER'?'FROZEN':null},{prefer:'return=minimal'}).catch(()=>{}));
  }catch(e){}
  onDataChanged('inbox');
}
/* prod: the Kitchen Prep product fetched a moment ago (else the loaded one). */
function inboxPayload(r,prod){
  const st=r.label_status==='FREEZER'?'FROZEN':null;const q=String(r.quantity??'1').trim();const whole=/^\d+$/.test(q);
  const p=prod&&!prod.gone?prod:productByName(r.product_name);const kp=!!(p&&p.src==='kp');
  const use=kp?{contains:p.contains.join(', ')||null,may:p.may.join(', ')||null}:{contains:r.contains||null,may:r.may_contain||null};
  const made=isYmd(r.date_prepped)?r.date_prepped:ymd();
  // Kitchen Prep dates its stock labels by its chilled/frozen days; a component with a shorter life gets its own.
  const cap=kp?(st?addDays(made,frozenDays()):addHours(made,p.shelfHours||chilledDays()*24)):null;
  let useby=isYmd(r.date_useby)?r.date_useby:(cap||'');if(cap&&(!useby||useby>cap))useby=cap;
  return{product_name:r.product_name,staff_name:r.staff_name||'',section:KP_SECTION[r.section]||r.section||null,job_code:r.job_code||null,quantity:whole?Math.max(1,Math.min(50,parseInt(q))):1,
    date_prepped:made,date_useby:useby,contains:use.contains,may_contain:use.may,status:st,status_date:st?made:null,
    weight_display:whole?null:(q||null),notes:r.notes||null,printed_at:hhmm(),source_note:'Kitchen Prep'};
}
function inboxExpired(r){const u=inboxPayload(r).date_useby;return!!u&&u<ymd();}
function inboxChanged(r){const p=productByName(r.product_name);return!!(p&&p.src==='kp'&&(!sameSet(alList(r.contains),p.contains)||!sameSet(alList(r.may_contain),p.may)));}
async function markInboxPrinted(r){
  const done=LS.get('dcps_inbox_done',[]);done.push(String(r.id));LS.set('dcps_inbox_done',done.slice(-300));
  S.inbox=S.inbox.filter(x=>String(x.id)!==String(r.id));
  try{await rest(CPS,'PATCH','print_jobs?id=eq.'+encodeURIComponent(r.id),{label_status:r.label_status==='FREEZER'?'FROZEN':null,printed_at:hhmm()},{prefer:'return=minimal'});}catch(e){}
  onDataChanged('inbox');
}

/* ── Printing records (history) — never lost ──────────────────────────── */
const BASE_COLS=['product_name','staff_name','section','job_code','quantity','date_prepped','date_useby','contains','may_contain','notes','printed_at','label_status'];
const EXT_COLS=['source','label_type','allergens_edited','status_date','weight_display'];
function pick(o,keys){const r={};keys.forEach(k=>{if(o[k]!==undefined)r[k]=o[k];});return r;}
async function insertRecord(rec){
  const useExt=S.ext!==false;
  let body=pick(rec,useExt?[...BASE_COLS,...EXT_COLS]:BASE_COLS);
  for(let attempt=0;attempt<3;attempt++){
    try{await rest(CPS,'POST','print_jobs',body,{prefer:'return=minimal'});if(useExt&&S.ext!==true){S.ext=true;LS.set('dcps_ext',true);}return true;}
    catch(e){
      if(e.offline)throw e;
      if(isColumnError(e)&&Object.keys(body).some(k=>EXT_COLS.includes(k))){S.ext=false;LS.set('dcps_ext',false);body=pick(rec,BASE_COLS);continue;}
      if(e.code==='23502'){body={...body};['date_useby','date_prepped'].forEach(k=>{if(body[k]==null)body[k]=rec.date_prepped||ymd();});['section','job_code','contains','may_contain','notes','label_status'].forEach(k=>{if(body[k]==null)body[k]='';});continue;}
      throw e;
    }
  }
  return false;
}
function savePending(){LS.set('dcps_pending_records',S.pendingRecords);}
async function recordPrint(rec){
  try{await insertRecord(rec);onDataChanged('history');return true;}
  catch(e){S.pendingRecords.push({rec,at:Date.now(),pid:uid(),error:e.offline?null:e.message});savePending();onDataChanged('history');return false;}
}
async function flushRecords(){
  if(!S.pendingRecords.length||flushRecords.busy)return;
  flushRecords.busy=true;
  const batch=S.pendingRecords;S.pendingRecords=[];
  const keep=[];let offline=false,sent=0;
  for(const p of batch){
    if(offline){keep.push(p);continue;}
    try{await insertRecord(p.rec);sent++;}
    catch(e){if(e.offline){offline=true;}else{p.tries=(p.tries||0)+1;p.error=e.message;}keep.push(p);}
  }
  S.pendingRecords=keep.concat(S.pendingRecords);savePending();
  flushRecords.busy=false;
  if(sent)onDataChanged('history');
}

/* ── Didn't print: kept until it prints or someone discards it ────────── */
function saveOutbox(){LS.set('dcps_outbox',S.outbox);updateBadges();}
function addToOutbox(item,res){
  const ex=S.outbox.find(o=>o.id===item.id);
  const info={error:res.error,maybePrinted:!!res.timeout,unreachable:!!res.unreachable,stale:!!res.stale,fresh:res.fresh||null};
  if(ex){Object.assign(ex,info);ex.tries=(ex.tries||1)+1;ex.at=Date.now();}
  else S.outbox.unshift({...item,...info,tries:1,at:Date.now()});
  saveOutbox();
}
function removeFromOutbox(id){S.outbox=S.outbox.filter(o=>o.id!==id);saveOutbox();}
/* Send one item ({id,kind,payload,record,title}) to the printer; record it once it's sent. */
async function sendItem(item){
  const res=await sendToPrinter({...item.payload,job_id:item.id});
  if(res.ok){removeFromOutbox(item.id);recordPrint({...item.record,printed_at:item.payload.printed_at||hhmm()});return res;}
  addToOutbox(item,res);
  return res;
}

/* Everything that changes data tells the visible view to redraw. */
const _listeners={};
function onData(kind,fn){(_listeners[kind]=_listeners[kind]||[]).push(fn);}
function onDataChanged(kind){(_listeners[kind]||[]).forEach(fn=>{try{fn();}catch(e){console.error(e);}});(_listeners.any||[]).forEach(fn=>{try{fn(kind);}catch(e){console.error(e);}});}

/* One tap, one action: a second tap while the first is still running is ignored. */
const _busy=new Set();
async function once(key,fn){if(_busy.has(key))return;_busy.add(key);try{return await fn();}finally{_busy.delete(key);}}

const LBL_W=696;
const LF={large:[700,36],medium:[700,28],small:[400,22],label:[700,20],notes:[400,24],tiny:[400,18],title:[700,52]};
const ASC={18:17,20:19,22:21,24:23,28:26,36:34,52:49};
const RGB=(r,g,b)=>`rgb(${r},${g},${b})`;
const RED=RGB(185,0,0),INK=RGB(20,20,20);
let _fontsReady=null;
function loadLabelFonts(){
  if(_fontsReady)return _fontsReady;
  _fontsReady=(async()=>{
    try{
      const reg=new FontFace('LabelSans',`url(data:font/woff2;base64,${FONT_REG})`,{weight:'400'});
      const bold=new FontFace('LabelSans',`url(data:font/woff2;base64,${FONT_BOLD})`,{weight:'700'});
      await Promise.all([reg.load(),bold.load()]);document.fonts.add(reg);document.fonts.add(bold);return true;
    }catch(e){console.warn('Label fonts',e);return false;}
  })();
  return _fontsReady;
}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=Math.max(1,h);return c;}
let _mx=null;
function mctx(){if(!_mx)_mx=mkCanvas(8,8).getContext('2d');return _mx;}
function setFont(ctx,k){const[w,s]=LF[k];ctx.font=`${w===700?'bold ':''}${s}px LabelSans,"DejaVu Sans",Verdana,sans-serif`;return s;}
function tw(text,k){const c=mctx();setFont(c,k);const m=c.measureText(String(text));const r=m.actualBoundingBoxRight,l=m.actualBoundingBoxLeft;return Math.round(r!=null&&l!=null?r+l:m.width);}
function wrapToWidth(text,k,maxW){
  const words=String(text).split(/\s+/).filter(Boolean);const lines=[];let cur='';
  for(const w of words){const t=(cur+' '+w).trim();if(tw(t,k)<=maxW)cur=t;else{if(cur)lines.push(cur);cur=w;}}
  if(cur)lines.push(cur);return lines.length?lines:[String(text)];
}
/* Python's textwrap.wrap (character widths, breaks long words, splits after hyphens). */
function pyWrap(text,width){
  text=String(text).replace(/[\t\n\x0b\x0c\r]/g,' ');
  const chunks=[];
  text.split(/(\s+)/).forEach(tok=>{
    if(!tok)return;if(/^\s+$/.test(tok)){chunks.push(tok);return;}
    let rest=tok;const re=/^([^-]*?[A-Za-z0-9]-)(?=[A-Za-z])/;let m;
    while((m=re.exec(rest))&&m[1].length<rest.length){chunks.push(m[1]);rest=rest.slice(m[1].length);}
    chunks.push(rest);
  });
  const lines=[];chunks.reverse();
  while(chunks.length){
    const cur=[];let len=0;
    if(chunks[chunks.length-1].trim()===''&&lines.length)chunks.pop();
    while(chunks.length){const l=chunks[chunks.length-1].length;if(len+l<=width){cur.push(chunks.pop());len+=l;}else break;}
    if(chunks.length&&chunks[chunks.length-1].length>width){const space=Math.max(width-len,1);const c=chunks[chunks.length-1];cur.push(c.slice(0,space));chunks[chunks.length-1]=c.slice(space);}
    if(cur.length&&cur[cur.length-1].trim()==='')cur.pop();
    if(cur.length)lines.push(cur.join(''));
  }
  return lines;
}
function box(x,x0,y0,x1,y1,col){x.fillStyle=col;x.fillRect(x0,y0,x1-x0+1,y1-y0+1);}   // PIL rectangles include both ends
function txt(x,px,py,text,k,col){const s=setFont(x,k);x.fillStyle=col;x.textBaseline='alphabetic';x.fillText(String(text),px,py+(ASC[s]||Math.round(s*.93)));}
function sv(d,k){const v=d[k];return v==null?'':String(v).trim();}
function fmtShort(v){return isYmd(v)?v.slice(8,10)+'/'+v.slice(5,7)+'/'+v.slice(2,4):(v||'');}

function drawAllergens(x,W,y,contains,may,alLines,mayLines,alH){
  box(x,0,y,W,y+6,(contains||may)?RED:RGB(60,60,60));y+=6;
  if(contains||may){
    box(x,0,y,W,y+alH,RGB(255,235,235));box(x,0,y,8,y+alH,RED);
    let ay=y+12;for(const l of alLines){txt(x,16,ay,l,'small',RED);ay+=28;}
    for(const l of mayLines){txt(x,16,ay,l,'tiny',RGB(100,20,20));ay+=24;}
  }else{
    box(x,0,y,W,y+alH,RGB(240,240,240));box(x,0,y,8,y+alH,RGB(60,60,60));
    txt(x,16,y+9,'No allergens declared','label',RGB(60,60,60));
  }
  return y+alH;
}
function drawNotes(x,W,y,lines,notesH){
  if(!lines.length)return y;
  box(x,0,y,W,y+2,RGB(60,60,60));y+=2;
  box(x,0,y,W,y+notesH,RGB(255,250,235));box(x,0,y,8,y+notesH,RGB(140,100,0));
  let ny=y+12;for(const l of lines){txt(x,16,ny,l,'notes',RGB(60,40,0));ny+=28;}
  return y+notesH;
}
function drawFooter(x,W,y,total,text){box(x,0,y,W,y+2,RGB(60,60,60));y+=2;box(x,0,y,W,total,RGB(220,220,220));txt(x,10,y+7,text,'tiny',RGB(60,60,60));}

function drawStandard(d){
  const W=LBL_W;
  const product=sv(d,'product_name'),job=sv(d,'job_code'),prepped=sv(d,'date_prepped'),useby=sv(d,'date_useby'),staff=sv(d,'staff_name'),section=sv(d,'section');
  const contains=sv(d,'contains'),may=sv(d,'may_contain'),notes=sv(d,'notes'),printedAt=sv(d,'printed_at'),note=sv(d,'source_note');
  const status=(sv(d,'status')||sv(d,'label_status')).toUpperCase();
  const statusDate=sv(d,'status_date')||prepped,weight=sv(d,'weight_display');
  const jcW=job?tw(job,'small')+20:0;

/* brother_ql red mode: black where V<80; red where hue is red, S>100, V>80;
   a dot prints where the kept pixel's luminance is 179 or darker. */
function thermal(c){
  const x=c.getContext('2d',{willReadFrequently:true});const img=x.getImageData(0,0,c.width,c.height);const p=img.data;
  for(let i=0;i<p.length;i+=4){
    const r=p[i],g=p[i+1],b=p[i+2];const mx=r>g?(r>b?r:b):(g>b?g:b),mn=r<g?(r<b?r:b):(g<b?g:b);
    const L=(r*19595+g*38470+b*7471+0x8000)>>16;let o=0;
    if(mx<80){if(L<=179)o=1;}
    else if(mx>80&&mx!==mn){
      const cr=mx-mn,s=Math.floor(cr/mx*255);
      if(s>100){const rc=(mx-r)/cr,gc=(mx-g)/cr,bc=(mx-b)/cr;let hh=r===mx?bc-gc:g===mx?2+rc-bc:4+gc-rc;hh=((hh/6+1)%1);const H=Math.floor(hh*255);if((H<40||H>210)&&L<=179)o=2;}
    }
    if(o===1){p[i]=24;p[i+1]=22;p[i+2]=21;}else if(o===2){p[i]=213;p[i+1]=25;p[i+2]=32;}else{p[i]=p[i+1]=p[i+2]=255;}
    p[i+3]=255;
  }
  x.putImageData(img,0,0);return c;
}

  const w=Math.min(src.width,Math.max(120,want)),hgt=Math.round(src.height*w/src.width);
  canvas.width=w;canvas.height=hgt;
  const x=canvas.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';

}

/* ═══════════════════════════════════════════════════════════════════════
   PRINTER — the Pi's print server, reached through ngrok. Its address lives
   in Kitchen Prep (app_settings.butchery_printer_url), so both apps always
   print to the same place.
   ═══════════════════════════════════════════════════════════════════════ */
LS.del('dcps_printer');   // CPS 3.0 kept a per-device address; there's one shared address now
function printerBase(){
  let u=String(kpSetting('butchery_printer_url','')||DEFAULT_PRINTER).trim();
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  return u.replace(/\/(print|status|butchery\/label)?\/*$/,'');
}
async function piCall(method,path,body,ms){
  let r;
  try{r=await fetch(printerBase()+path,{method,headers:{'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},body:body?JSON.stringify(body):undefined,signal:timeoutSignal(ms||20000),cache:'no-store'});}
  catch(e){
    const timeout=!!(e&&(e.name==='TimeoutError'||e.name==='AbortError'));
    const err=new Error(timeout?'The printer didn’t answer in time':'Can’t reach the Pi');err.unreachable=!timeout;err.timeout=timeout;throw err;
  }
  const text=await r.text();let d=null;try{d=JSON.parse(text);}catch(e){}
  if(!d){const err=new Error(r.status===502||/ERR_NGROK_8012/.test(text)?'The Pi is on, but its print server isn’t running':/ERR_NGROK_3200/.test(text)?'The Pi is offline':'The Pi sent something unexpected (HTTP '+r.status+')');err.unreachable=true;throw err;}
  if(!r.ok&&d.success!==true){const err=new Error(d.error||('HTTP '+r.status));err.data=d;err.status=r.status;throw err;}
  return d;
}
/* A big run takes the Pi a while to prepare, so the wait grows with the count.
   "Didn't answer in time" may still have printed — it's never resent by itself. */
async function sendToPrinter(payload){
  const n=Math.max(1,Math.min(50,parseInt(payload.quantity)||1));
  try{const d=await piCall('POST','/print',payload,45000+n*1500);if(d.success)return{ok:true,ip:d.printer_ip};return{ok:false,error:d.error||'The printer said no'};}
  catch(e){return{ok:false,error:e.message,unreachable:!!e.unreachable,timeout:!!e.timeout};}
  finally{setTimeout(checkPrinter,1500);}
}
async function checkPrinter(){
  if(checkPrinter.busy)return S.printer;checkPrinter.busy=true;
  const was=S.printer.state;
  try{
    const d=await piCall('GET','/status',null,7000);
    const found=('printer' in d)?d.printer===true:!!(d.success||d.ok||d.status==='ok');
    S.printer={state:found?'ready':(d.searching?'searching':'noprinter'),info:d,at:Date.now(),error:null};
  }catch(e){S.printer={state:'offline',info:null,at:Date.now(),error:e.message};}
  finally{checkPrinter.busy=false;}
  renderPrinterPill();onDataChanged('printer');
  if(S.printer.state==='ready'){if(S.pendingRecords.length)flushRecords();if(was!=='ready'&&was!=='unknown'&&typeof onPrinterBack==='function')onPrinterBack();}
  return S.printer;
}
function printerText(){
  const p=S.printer;
  switch(p.state){
    case'ready':return['ok','Printer ready',p.info&&p.info.printer_ip?'Brother QL · '+p.info.printer_ip:'Brother QL-820'];
    case'searching':return['warn pulse','Finding the printer…','The Pi is looking for it'];
    case'noprinter':return['bad','Printer not found','Is it on, with labels in?'];
    case'offline':return['bad','Printer offline',p.error||'Can’t reach the Pi'];
    default:return['','Checking printer…',''];
  }
}

  const s=S.staff.find(x=>String(x.id)===String(ss.id));
  if(!s&&!ss.name)return false;
  S.user=s?{id:s.id,name:s.name,color:s.color,initials:s.initials}:{id:ss.id,name:ss.name};return true;
}
function loginKey(e){
  if(!_pinFor)return;
  if(/^[0-9]$/.test(e.key)){e.preventDefault();pinKey(e.key);}
  else if(e.key==='Backspace'){e.preventDefault();pinDel();}
  else if(e.key==='Escape'){_pinFor=null;_pinBuf='';renderLogin();}
}

async function firstRun(){
  const name=titleCase(($('#fr-name')||{}).value||''),pin=String(($('#fr-pin')||{}).value||'').trim();
  if(!name){toast('Type your name',{type:'err'});$('#fr-name')?.focus();return;}
  if(!/^\d{4}$/.test(pin)){toast('The PIN is 4 numbers',{type:'err'});$('#fr-pin')?.focus();return;}
  try{
    await rest(CPS,'POST','staff',{name,pin,initials:initials(name),color:COLS[0]},{prefer:'return=minimal'});
    await loadStaff();const s=S.staff.find(x=>norm(x.name)===norm(name));if(s)signIn(s);
  }catch(e){toast('Couldn’t add you — '+e.message,{type:'err'});}
}
/* Signed in for 12 hours on a device, even if the app stays open. */
setInterval(()=>{if(!S.user)return;const ss=LS.get('dcps_session',null);if(!ss||!(ss.exp>Date.now())){alog('Signed out after 12 hours','');signOut();toast('Signed out after 12 hours — sign in again');}},60000);

/* ═══════════════════════════════════════════════════════════════════════
   PRINT — Product → (Job) → (Section) → (Allergens) → Check and print.
   Anything already known is filled in and its step skipped:
   · the job stays chosen for the next labels (for 3 hours) — pick the
     wedding once, then just tap products; its menu is listed first;
   · a Kitchen Prep product brings its section and locked allergens;
   · a custom product brings its allergens; its section is remembered;
   · only a one-off asks for allergens.
   After Print the wizard is instantly ready for the next label.
   ═══════════════════════════════════════════════════════════════════════ */
let W=null;
const STEP_TITLES={product:'Print',job:'Which job?',section:'Which section?',allergens:'Allergens',review:'Check and print'};
const STICKY_MS=3*3600e3;
function stickyJob(){const j=LS.get('dcps_job',null);if(!j||Date.now()-j.at>STICKY_MS)return undefined;return j.code?jobByCode(j.code):null;}
function setSticky(job){if(job===undefined)LS.del('dcps_job');else LS.set('dcps_job',{code:job?job.code:null,at:Date.now()});}
function defaultMaker(){const m=LS.get('dcps_maker',null);if(m&&Date.now()-m.at<12*3600e3&&S.staff.some(s=>s.name===m.name))return m.name;return S.user?S.user.name:'';}
function freshW(){
  return{step:'product',q:'',filter:'all',prod:null,job:stickyJob(),section:undefined,sectionFrom:'',flow:['product','review'],
    al:{c:[],m:[],none:false,chosen:false,unlocked:false},alMode:'c',
    status:'',statusChosen:true,made:ymd(),statusDate:ymd(),useby:'',usebyManual:false,
    staff:defaultMaker(),wmode:'none',wtotal:'',wunit:'kg',wportions:'',wsize:'',wsunit:'g',
    notes:'',labels:1,saveProduct:false,reprint:null,shield:0};
}
AL_ED.wiz={
  get:()=>({c:[...W.al.c],m:[...W.al.m],none:W.al.none,mode:W.alMode}),
  set:s=>{W.al.c=s.c;W.al.m=s.m;W.al.none=s.none;W.alMode=s.mode;W.al.chosen=W.prod.src!=='oneoff'||s.none||s.c.length+s.m.length>0;},
  after:()=>{if(W.step==='allergens'){renderStepFoot();}else{const n=$('#rv-al-note');if(n)n.outerHTML=alEditNoteHTML();}renderSideSummary();schedulePreview();}
};

/* ── Steps ───────────────────────────────────────────────────────────── */
function firstIncomplete(){
  const p=W.prod;if(!p)return'product';
  if(W.job===undefined)return'job';
  if(W.section===undefined)return'section';
  if(p.src==='oneoff'&&!W.al.chosen)return'allergens';
  return'review';
}
function planFlow(){
  const p=W.prod,f=['product'];
  if(W.job===undefined||W.flow.includes('job'))f.push('job');
  if(p&&(W.section===undefined||W.flow.includes('section')))f.push('section');
  if(p&&p.src==='oneoff')f.push('allergens');
  f.push('review');W.flow=f;
}
function goStep(step,back){
  if(step!=='product'&&step!=='job'&&!W.prod)step='product';
  if(!W.flow.includes(step)){const order=['product','job','section','allergens','review'];W.flow=order.filter(s=>W.flow.includes(s)||s===step);}
  W.step=step;renderStep(back?'back':'fwd');
  const body=$('#step-body');if(body)body.scrollTop=0;
  if(step==='product')focusSearch();
}
function wizBack(){
  if(W.step==='product'){if(W.q){W.q='';renderStep();focusSearch();}return;}
  const i=W.flow.indexOf(W.step);goStep(W.flow[Math.max(0,i-1)],true);
}
function focusSearch(){if(!matchMedia('(hover:hover)').matches)return;setTimeout(()=>{const q=$('#q');if(q&&S.view==='print')q.focus({preventScroll:true});},30);}

/* ── Remembered choices ──────────────────────────────────────────────── */
function pushRecent(key){const r=LS.get('dcps_recent',[]).filter(k=>k!==key);r.unshift(key);LS.set('dcps_recent',r.slice(0,16));}
function recentProducts(){const all=allProducts();return LS.get('dcps_recent',[]).map(k=>all.find(p=>p.key===k)).filter(Boolean);}
function lastSectionFor(p){const m=LS.get('dcps_last_section',{})||{};return Object.prototype.hasOwnProperty.call(m,norm(p.name))?m[norm(p.name)]:undefined;}
function rememberSection(p,sec){const m=LS.get('dcps_last_section',{})||{};m[norm(p.name)]=sec;const keys=Object.keys(m);if(keys.length>400)delete m[keys[0]];LS.set('dcps_last_section',m);}

/* ── Dates and derived values ────────────────────────────────────────── */
function autoUseby(){
  const p=W.prod;if(!p)return'';
  if(W.status==='FROZEN')return addDays(W.statusDate||ymd(),frozenDays());
  if(W.status==='THAWED')return addHours(W.statusDate||ymd(),Math.min(72,p.shelfHours||72));
  return addHours(W.made||ymd(),p.shelfHours||chilledDays()*24);
}
function recalcUseby(){W.useby=autoUseby();W.usebyManual=false;}
function usebyRule(){
  const p=W.prod;if(!p)return'';
  if(W.status==='FROZEN')return plural(frozenDays(),'day')+' frozen';
  if(W.status==='THAWED'){const t=Math.min(72,p.shelfHours||72);return(t%24?t+' hours':plural(Math.floor(t/24),'day'))+' once thawed';}
  const hrs=p.shelfHours||72;return hrs%24?hrs+' hours':plural(hrs/24,'day');
}
function weightDisplay(){
  if(W.wmode==='weight'){const v=String(W.wtotal).trim();return v?v+W.wunit:null;}
  if(W.wmode==='portions'){const n=parseInt(W.wportions);if(!n)return null;const sz=String(W.wsize).trim();return`×${n} portions`+(sz?` · ${sz}${W.wsunit} each`:'');}
  return null;
}
function alEdited(){
  const p=W.prod;if(!p||p.src==='oneoff')return false;
  if(W.al.none)return p.contains.length+p.may.length>0;
  return!sameSet(W.al.c,p.contains)||!sameSet(W.al.m,p.may);
}
function sourceNote(){const p=W.prod;if(!p)return'';const base=p.src==='kp'?'Kitchen Prep':p.src==='custom'?'Custom':'One-off';return base+(alEdited()?' · allergens edited':'');}
function wizPayload(){
  const p=W.prod||{name:''};const al=W.al;const status=W.statusChosen?(W.status||null):null;
  return{product_name:p.name,staff_name:W.staff||(S.user&&S.user.name)||'',section:W.section||null,job_code:W.job?W.job.code:null,quantity:W.labels,
    date_prepped:W.made,date_useby:W.useby,contains:al.none?null:(al.c.join(', ')||null),may_contain:al.none?null:(al.m.join(', ')||null),no_allergens:!!al.none,
    status,status_date:status?W.statusDate:null,weight_mode:W.wmode==='none'?null:W.wmode,weight_display:weightDisplay(),
    notes:String(W.notes||'').trim()||null,printed_at:hhmm(),source_note:sourceNote()};
}
function wizRecord(pl){
  const p=W.prod;
  return{product_name:pl.product_name,staff_name:pl.staff_name,section:pl.section,job_code:pl.job_code,quantity:pl.quantity,date_prepped:pl.date_prepped,date_useby:pl.date_useby,
    contains:pl.contains,may_contain:pl.may_contain,notes:pl.notes,printed_at:pl.printed_at,label_status:pl.status,
    source:p.src==='kp'?'kitchen-prep':p.src==='custom'?'custom':'one-off',label_type:'standard',allergens_edited:alEdited(),status_date:pl.status_date,weight_display:pl.weight_display};
}

/* ── Picks ───────────────────────────────────────────────────────────── */
function applyPick(p){
  const changed=!W.prod||W.prod.key!==p.key;
  W.prod=p;
  if(changed){
    W.al={c:[...p.contains],m:[...p.may],none:false,chosen:p.src!=='oneoff',unlocked:false};W.alMode='c';
    if(p.section){W.section=p.section;W.sectionFrom=p.src==='kp'?'kp':'product';}
    else{const last=lastSectionFor(p);if(last!==undefined&&p.src!=='oneoff'){W.section=last;W.sectionFrom='last';}else{W.section=undefined;W.sectionFrom='';}}
    W.made=ymd();W.statusDate=ymd();W.status='';W.statusChosen=!p.frozen;
    recalcUseby();W.saveProduct=false;W.reprint=null;W.labels=1;
  }
  W.flow=['product'];planFlow();
}
function refreshSticky(){if(!W.prod&&W.job!==undefined&&stickyJob()===undefined)W.job=undefined;}
function wizPick(p){if(Date.now()<W.shield)return;refreshSticky();applyPick(p);if(W.prod.src!=='oneoff')pushRecent(p.key);goStep(firstIncomplete());}
function titleCaseFirst(s){s=String(s||'').trim().replace(/\s+/g,' ');return s?s[0].toUpperCase()+s.slice(1):'';}
function wizPickOneOff(){const name=titleCaseFirst(W.q);if(name)wizPick(oneOff(name,[],[]));}
function wizPickJob(code){
  W.job=code?jobByCode(code):null;setSticky(W.job);
  if(!W.prod){goStep('product',true);return;}
  goStep(firstIncomplete());
}
function wizPickSection(v){W.section=v;W.sectionFrom='chosen';if(W.prod&&!W.prod.section&&W.prod.src!=='oneoff')rememberSection(W.prod,v);goStep(firstIncomplete());}

/* ── Step 1: product ─────────────────────────────────────────────────── */

  const j=W.job;

}
function bodyProduct(){

    <div class="find">
      ${jobPillHTML()}
      <div id="inbox"></div>

      <div class="chip-row" id="prod-filters">${filtersHTML()}</div>

function filtersHTML(){

let _ibOpen=false;

  const el=$('#inbox');if(!el)return;
  if(!S.inbox.length){el.innerHTML='';_ibOpen=false;return;}
  const MAX=3,rows=_ibOpen?S.inbox:S.inbox.slice(0,MAX),more=S.inbox.length-rows.length;

      ${pl.date_useby&&pl.date_useby<ymd()?`<div class="warn-note" style="margin-top:4px">${ico('warning','ico-sm')}Use-by has passed — it can’t be printed</div>`:''}</div>
      <button class="btn btn-sm btn-plain" data-act="ib-dismiss" data-id="${h(r.id)}">Dismiss</button>${pl.date_useby&&pl.date_useby<ymd()?'':`<button class="btn btn-sm btn-primary" data-act="ib-print" data-id="${h(r.id)}">Print</button>`}</div>`;}).join('')}${more?`<button class="inbox-more" data-act="ib-more">Show ${more} more</button>`:''}</div>`;
}
function matchScore(p,words,q){
  const hay=norm(p.name+' '+(p.dish||'')+' '+p.cat+' '+(p.section||''));
  if(!words.every(w=>hay.includes(w)))return-1;
  const n=norm(p.name);if(n===q)return 0;if(n.startsWith(q))return 1;if(n.split(/[\s—-]+/).some(w=>w.startsWith(words[0])))return 2;return 3;
}
function sectionOrder(s){const i=SECTIONS.indexOf(s);return i<0?99:i;}
function renderProducts(){
  const el=$('#prod-results');if(!el)return;
  const fr=$('#prod-filters');if(fr){const html=filtersHTML();if(fr.innerHTML!==html)fr.innerHTML=html;}
  const q=norm(W.q),words=q.split(' ').filter(Boolean);
  let list=allProducts();
  const f=W.filter;
  if(f==='kp')list=list.filter(p=>p.src==='kp');
  else if(f==='custom')list=list.filter(p=>p.src==='custom');
  else if(f==='recent')list=recentProducts();
  else if(f!=='all')list=list.filter(p=>(p.section||'Other')===f);
  const loading=!allProducts().length&&(S.kp.ok===null||S.cps.ok===null);
  if(loading&&!q){el.innerHTML=`<div class="tiles">${Array.from({length:8},()=>'<div class="tile skel"></div>').join('')}</div>`;return;}
  if(q){
    const scored=list.map(p=>[p,matchScore(p,words,q)]).filter(x=>x[1]>=0).sort((a,b)=>a[1]-b[1]||a[0].name.localeCompare(b[0].name)).map(x=>x[0]);
    const exact=allProducts().some(p=>norm(p.name)===q);
    const one=exact?'':`<button class="oneoff-row" data-act="wiz-oneoff">${ico('plus')}<span class="grow">Print “<b>${h(titleCaseFirst(W.q))}</b>” as a one-off</span><span class="faint">you’ll set its allergens</span></button>`;
    el.innerHTML=one+(scored.length?`<div class="tiles">${scored.slice(0,150).map(p=>tileHTML(p)).join('')}</div>`:`<div class="empty-s muted" style="padding:10px 4px">Nothing called “${h(W.q)}” in Kitchen Prep or your custom products.</div>`);
    return;
  }
  if(!list.length){
    const msg=f==='recent'?['clock','Nothing printed yet','Products you print appear here for next time.']:f==='custom'?['tag','No custom products','Add them in Manage → Products, or save a one-off when you print it.']:!allProducts().length?['search','No products yet','Type a name above to print a one-off.']:['search','None here',''];

/* ── Print ───────────────────────────────────────────────────────────── */
async function wizPrint(){
  const p=W.prod;
  if(!p){toast('Pick a product first',{type:'err'});return;}
  if(W.job===undefined){goStep('job');return;}
  if(W.section===undefined){goStep('section');return;}
  if(p.src==='oneoff'&&!W.al.chosen){goStep('allergens');toast('Set the allergens — or tap No allergens',{type:'err'});return;}
  if(!W.statusChosen){const s=$('#rv-store');if(s){s.scrollIntoView({behavior:'smooth',block:'center'});s.classList.remove('pulse');void s.offsetWidth;s.classList.add('pulse');}return;}
  if(!W.staff){toast('Tap who made it',{type:'err'});$('#rv-makers')?.scrollIntoView({block:'center'});return;}
  if(!isYmd(W.useby)){toast('Set a use-by date',{type:'err'});$('#rv-useby')?.focus();return;}
  if(W.useby<ymd()){toast('That use-by date has passed — change it to print',{type:'err'});$('#rv-useby')?.focus();return;}
  if(W.wmode==='weight'&&!(parseFloat(W.wtotal)>0)){toast('Type the weight — or choose None',{type:'err'});$('[data-k=wtotal]')?.focus();return;}
  if(W.wmode==='portions'&&!(parseInt(W.wportions)>0)){toast('Type how many portions — or choose None',{type:'err'});$('[data-k=wportions]')?.focus();return;}
  const payload=wizPayload(),record=wizRecord(payload);
  const item={id:uid(),kind:'standard',payload,record,title:payload.product_name,at:Date.now(),base:{key:p.key,src:p.src,dishId:p.dishId||null,contains:[...p.contains],may:[...p.may],shelfHours:p.shelfHours},
    state:{job:W.job?W.job.code:null,section:W.section,status:W.status,made:W.made,statusDate:W.statusDate,useby:W.useby,usebyManual:W.usebyManual,staff:W.staff,notes:W.notes,labels:W.labels,al:{...W.al}}};
  if(p.src!=='oneoff')pushRecent(p.key);
  if(!W.reprint)setSticky(W.job);
  LS.set('dcps_maker',{name:W.staff,at:Date.now()});
  if(p.src==='oneoff'&&W.saveProduct)saveOneOffProduct(p,W);
  alog('Printed',`${payload.quantity}× ${payload.product_name}${payload.job_code?' · '+payload.job_code:''}${record.allergens_edited?' · allergens edited':''}`);
  animateOut();
  // Instantly ready for the next label; the print carries on in the background.
  W=freshW();W.shield=Date.now()+600;renderStep();const b=$('#step-body');if(b)b.scrollTop=0;focusSearch();
  await sendChecked(item,true);
}
/* Kitchen Prep products: their allergens are checked against Kitchen Prep
   the moment before printing, so a change made a minute ago is never missed. */
const _sending=new Set();   // one send per label run at a time, however it's retried
async function sendChecked(item,fromWizard){
  if(_sending.has(item.id))return{ok:false,busy:true};
  _sending.add(item.id);
  try{return await sendCheckedNow(item);}finally{_sending.delete(item.id);}
}
async function sendCheckedNow(item){
  const n=item.payload.quantity,title=item.title;
  toast(`Printing ${plural(n,'label')} — ${title}`,{type:'busy'});
  if(item.base&&item.base.src==='kp'){
    const fresh=await freshKpProduct({key:item.base.key,src:'kp',dishId:item.base.dishId});
    const alChanged=fresh&&!fresh.gone&&(!sameSet(fresh.contains,item.base.contains)||!sameSet(fresh.may,item.base.may));
    const lifeChanged=fresh&&!fresh.gone&&!(item.state&&item.state.usebyManual)&&item.base.shelfHours!=null&&fresh.shelfHours!==item.base.shelfHours;
    if(fresh&&(fresh.gone||alChanged||lifeChanged)){
      loadKP();
      const why=fresh.gone?'It’s no longer in Kitchen Prep':alChanged?'Kitchen Prep changed its allergens — check them and print again':'Kitchen Prep changed how long it keeps — check the use-by and print again';
      addToOutbox(item,{error:why,stale:true,fresh:fresh.gone?null:fresh});renderPrintBanner();updateBadges();
      if(S.view==='print'){hideToast();if(navigator.vibrate)try{navigator.vibrate([60,60,60]);}catch(e){}}
      else toast(fresh.gone?`${title} wasn’t printed — it’s no longer in Kitchen Prep.`:`${title} wasn’t printed — ${alChanged?'Kitchen Prep changed its allergens a moment ago. Check them':'Kitchen Prep changed how long it keeps. Check the use-by'} and print again.`,{type:'err',action:fresh.gone?null:'Check',onAction:fresh.gone?null:()=>{const it=S.outbox.find(o=>o.id===item.id);if(it){removeFromOutbox(it.id);renderPrintBanner();}reopenItem(item,fresh);}});
      return{ok:false,stale:true};
    }
  }
  const res=await sendItem(item);
  if(res.ok)toast(`Sent ${plural(n,'label')} — ${title}`,{action:'Print again',onAction:()=>printAgain(item)});
  else if(S.view==='print'){hideToast();if(navigator.vibrate)try{navigator.vibrate([60,60,60]);}catch(e){}}
  else if(res.timeout)toast(`${title}: the printer didn’t answer in time. It may have printed — check before retrying.`,{type:'err',ms:8000});
  else toast(`${title} didn’t print — ${res.error}`,{type:'err',ms:6000,action:'Retry',onAction:()=>retryOutbox(item.id)});
  renderPrintBanner();updateBadges();
  return res;
}
function printAgain(item){return once('again-'+item.id,()=>sendChecked({...item,id:uid(),payload:{...item.payload,printed_at:hhmm()},record:{...item.record}}));}
function reopenItem(item,fresh){
  const p=fresh&&!fresh.gone?fresh:productByKey(item.base.key);if(!p)return;
  W=freshW();applyPick(p);const s=item.state||{};
  W.job=s.job?jobByCode(s.job):null;W.section=s.section;W.status=s.status||'';W.statusChosen=true;W.made=s.made||ymd();W.statusDate=s.statusDate||ymd();
  if(s.usebyManual&&isYmd(s.useby)){W.useby=s.useby;W.usebyManual=true;}else recalcUseby();
  W.staff=s.staff||W.staff;W.notes=s.notes||'';W.labels=s.labels||1;
  W.reprint={notice:'Kitchen Prep changed this product a moment ago — these are its allergens and use-by now.'};

async function saveOneOffProduct(p,w){
  const cat={'Dessert':'Desserts'}[w.section]||(CUSTOM_CATS.includes(w.section)?w.section:'Other');
  const days=daysBetween(w.made,w.useby);const hrs=w.status||days==null?72:days<=0?12:days*24;
  try{
    forgetKpName(p.name);
    await saveProductRow('POST','products',{name:p.name.replace(/\s—\s/g,' - '),category:cat,menu_type:CUSTOM_MARK,shelf_life_hours:hrs,contains:w.al.none?null:(w.al.c.join(', ')||null),may_contain:w.al.none?null:(w.al.m.join(', ')||null)});
    alog('Added product',p.name+' (from a one-off)');await loadCPS();

    if(w.section!==undefined&&np)rememberSection(np,w.section||'');

/* ── Load a history row back into the wizard (reprint: same batch) ──── */
function wizFromRecord(r){
  W=freshW();
  const rowC=alList(r.contains),rowM=alList(r.may_contain).filter(x=>!rowC.includes(x));
  let p=productByName(r.product_name),notice='';
  if(!p){p=oneOff(r.product_name,rowC,rowM);}
  applyPick(p);
  if(p.src==='oneoff'){
    const known=!!(rowC.length||rowM.length);
    W.al={c:rowC,m:rowM,none:false,chosen:known,unlocked:false};
    if(!known)notice='The original label didn’t record any allergens — set them before printing.';
  }else if(!sameSet(rowC,p.contains)||!sameSet(rowM,p.may))notice=`The allergens are different from the original label — this one uses ${p.src==='kp'?'Kitchen Prep’s':'the saved product’s'} current allergens.`;
  W.job=r.job_code?jobByCode(r.job_code):null;
  W.section=r.section||'';W.sectionFrom='';
  const st=String(r.label_status||'').toUpperCase();W.status=st==='FROZEN'||st==='THAWED'?st:'';W.statusChosen=true;
  W.made=isYmd(r.date_prepped)?r.date_prepped:ymd();
  W.statusDate=isYmd(r.status_date)?r.status_date:W.made;
  if(isYmd(r.date_useby)){W.useby=r.date_useby;W.usebyManual=W.useby!==autoUseby();}else recalcUseby();
  W.staff=r.staff_name||W.staff;
  W.notes=r.notes||'';
  W.labels=1;
  const wd=String(r.weight_display||'');let m;
  if((m=/^([\d.]+)\s*(kg|g)$/i.exec(wd))){W.wmode='weight';W.wtotal=m[1];W.wunit=m[2].toLowerCase();}
  else if((m=/^×(\d+) portions(?: · ([\d.]+)(g|ml) each)?$/.exec(wd))){W.wmode='portions';W.wportions=m[1];W.wsize=m[2]||'';W.wsunit=m[3]||'g';}
  W.reprint={notice,orig:parseInt(r.quantity)||1};
  W.flow=['product','review'];if(!W.al.chosen)W.flow=['product','allergens','review'];
  W.step=firstIncomplete();
  if(S.view!=='print')go('print');else renderPrintView();
}

/* ═══════════════════════════════════════════════════════════════════════
   CONTAINERS — the dry-store and walk-in tubs. Tap a container, tap it
   again for another label, Print. Big name on black, the date it went in,
   allergens. Containers live in CPS products (category "Container").
   ═══════════════════════════════════════════════════════════════════════ */
const CT={tray:LS.get('dcps_tray',[]),edit:false,busy:false};
let CE=null;
/* Date in: today, unless it was changed today. */
function ctDate(){const d=LS.get('dcps_ct_date',null);return d&&d.on===ymd()&&isYmd(d.v)?d.v:ymd();}
function setCtDate(v){LS.set('dcps_ct_date',{v,on:ymd()});}
function saveTray(){LS.set('dcps_tray',CT.tray);updateBadges();renderFloatBar();}
function trayCount(){return CT.tray.reduce((a,t)=>a+(t.count||0),0);}
function ctPayload(t){return{storage:true,product_name:t.name,date_prepped:ctDate(),contains:t.contains.join(', ')||null,may_contain:t.may.join(', ')||null,notes:null,printed_at:hhmm(),quantity:t.count};}
function ctRecord(t){return{product_name:t.name,staff_name:S.user?S.user.name:'',section:'Containers',job_code:null,quantity:t.count,date_prepped:ctDate(),date_useby:null,
  contains:t.contains.join(', ')||null,may_contain:t.may.join(', ')||null,notes:null,printed_at:hhmm(),label_status:null,source:'container',label_type:'container',allergens_edited:false};}
function refreshTray(){
  const list=containers();
  CT.tray.forEach(t=>{const c=t.id!=null?list.find(x=>String(x.id)===String(t.id)):null;if(c){t.name=c.name;t.contains=c.contains;t.may=c.may;}});
}
AL_ED.ce={get:()=>({c:[...CE.c],m:[...CE.m],none:CE.none,mode:CE.mode}),set:s=>{CE.c=s.c;CE.m=s.m;CE.none=s.none;CE.mode=s.mode;},after:()=>cePreview()};
function ctDateHTML(){const v=ctDate();return`<label class="date-pill" title="The date it went in the tub">${ico('calendar','ico-sm')}<span>Date in</span><b>${h(dayWords(v))}</b><input type="date" data-ch="ct-date" value="${h(v)}" aria-label="Date in"></label>`;}
function renderContainers(){
  $('#view-containers').innerHTML=`<div class="ph"><div class="ph-title">Containers<div class="ph-sub">Tap a tub to add its label</div></div>
    <div class="ph-acts"><span id="ct-date-pill">${ctDateHTML()}</span><button class="btn btn-sm${CT.edit?' btn-primary':''}" data-act="ct-edit">${CT.edit?'Done':ico('pencil')+'Edit'}</button><button class="btn btn-sm" data-act="ct-new">${ico('plus')}New</button></div></div>
    <div class="two"><div class="two-main" id="ct-main"></div><aside class="two-side show" id="ct-side"></aside></div>`;
  refreshTray();renderCtMain();renderCtSide();renderFloatBar();
}
function renderCtMain(){
  const el=$('#ct-main');if(!el)return;
  const list=containers();
  if(!list.length){
    el.innerHTML=S.cps.ok===null?`<div class="tiles">${Array.from({length:5},()=>'<div class="tile skel"></div>').join('')}</div>`
      :`<div class="empty">${ico('box')}<div class="empty-t">No containers yet</div><div class="empty-s">Make one for each tub in the dry store or walk-in. Its name prints big, with the date it went in and its allergens.</div>
        <div class="inline" style="justify-content:center;margin-top:12px"><button class="btn btn-primary" data-act="ct-seed">Add flour and sugar</button><button class="btn" data-act="ct-new">${ico('plus')}New container</button></div>
        <div class="empty-s faint" style="margin-top:8px">Plain, self raising and bread flour (gluten) · granulated and caster sugar</div></div>`;
    return;
  }
  el.innerHTML=`<div class="tiles ct-tiles${CT.edit?' edit-on':''}">${list.map(c=>{const t=CT.tray.find(x=>String(x.id)===String(c.id));
    return`<button class="tile" data-act="ct-tap" data-id="${h(c.id)}" aria-label="${h(c.name)}${t?', '+t.count+' to print':''}"><div class="tile-name">${h(c.name)}</div><div class="tile-meta">${alMetaHTML(c.contains,c.may)}</div>${t&&!CT.edit?`<span class="cnt" id="cnt-${h(c.id)}">${t.count}</span>`:''}<span class="edit-ico">${ico('pencil')}</span></button>`;}).join('')}</div>
    ${CT.edit?'<div class="group-ft" style="padding-top:12px">Tap a container to rename it or change its allergens.</div>':''}`;
}
function renderCtSide(){
  const el=$('#ct-side');if(!el)return;
  const n=trayCount(),last=CT.tray[CT.tray.length-1];
  el.innerHTML=`<div class="lp"><div class="lp-cap"><b>Label</b><span>as it prints</span></div>${last?previewHTML('lp-ct',last.count):`<div class="lp-ghost" style="height:170px">${ico('box')}<span>Tap a container</span></div>`}</div>
    <div><div class="group-hd"><span>To print</span><span class="n">${n?plural(n,'label'):''}</span></div>
    <div class="group">${CT.tray.length?CT.tray.map(t=>`<div class="tray-row"><span class="grow">${h(t.name)}<small class="${t.contains.length?'al-text':'muted'}">${h(t.contains.length?t.contains.join(', '):t.may.length?'May contain '+t.may.join(', '):'No allergens')}</small>${t.err?`<small class="q-err">${h(t.err)}</small>`:''}</span>
      <div class="stepper sm"><button class="btn" data-act="ct-dec" data-key="${h(t.key)}" data-hold="1" aria-label="One fewer ${h(t.name)}">${ico('minus')}</button><span class="stepper-n">${t.count}</span><button class="btn" data-act="ct-inc" data-key="${h(t.key)}" data-hold="1" aria-label="One more ${h(t.name)}" ${t.count>=50?'disabled':''}>${ico('plus')}</button></div></div>`).join('')
      :`<div class="empty" style="padding:26px 16px">${ico('box')}<div class="empty-s">Tap tubs to add their labels here.</div></div>`}</div></div>
    ${n?`<div class="side-foot"><button class="btn btn-primary btn-lg btn-block desk-only" data-act="ct-print" ${CT.busy?'disabled':''}>${CT.busy?'<span class="spin"></span>Printing…':ico('printer')+'Print '+plural(n,'label')}</button><button class="btn btn-sm btn-plain" data-act="ct-clear" ${CT.busy?'disabled':''}>Clear</button></div>`:''}`;
  if(last)paintLabel($('#lp-ct'),ctPayload(last));
}
function ctTap(id){
  const c=containers().find(x=>String(x.id)===String(id));if(!c)return;
  if(CT.edit){ctEditSheet(c);return;}
  let t=CT.tray.find(x=>String(x.id)===String(c.id));
  if(t){if(t.count>=50)return;t.count++;t.err=null;CT.tray=CT.tray.filter(x=>x!==t).concat([t]);}
  else{t={key:'id:'+c.id,id:c.id,name:c.name,contains:c.contains,may:c.may,count:1};CT.tray.push(t);}
  saveTray();renderCtMain();renderCtSide();
  const b=$('#cnt-'+CSS.escape(String(c.id)));if(b)b.classList.add('pop');
}
function ctStep(key,d){
  const t=CT.tray.find(x=>x.key===key);if(!t)return;
  t.count=Math.min(50,t.count+d);t.err=null;
  if(t.count<=0)CT.tray=CT.tray.filter(x=>x!==t);
  saveTray();renderCtMain();renderCtSide();
}
async function ctPrint(){
  if(CT.busy||!CT.tray.length)return;
  CT.busy=true;renderCtSide();renderFloatBar();
  let ok=0,bad=0,err='';
  for(const t of [...CT.tray]){
    const n=t.count;if(!(n>0))continue;
    if(!t.jid||t.jidN!==n){t.jid=uid();t.jidN=n;}
    let res=await sendToPrinter({...ctPayload(t),quantity:n,job_id:'ct-'+t.jid});
    if(!res.ok&&!res.timeout){await new Promise(r=>setTimeout(r,2500));res=await sendToPrinter({...ctPayload(t),quantity:n,job_id:'ct-'+t.jid});}
    if(res.ok){ok+=n;recordPrint(ctRecord({...t,count:n}));t.count-=n;t.jid=null;if(t.count<=0)CT.tray=CT.tray.filter(x=>x!==t);}
    else{bad++;t.err=res.timeout?'Didn’t answer in time — it may have printed':res.error;err=res.error;break;}
    saveTray();
  }
  CT.busy=false;saveTray();renderCtMain();renderCtSide();renderFloatBar();
  if(ok)alog('Printed container labels',plural(ok,'label'));
  if(!bad)toast(`Sent ${plural(ok,'container label')} to the printer`);
  else toast(`${ok?ok+' sent. ':''}The rest are still here — ${err}`,{type:'err',ms:6000,action:'Retry',onAction:ctPrint});
}
function ctEditSheet(c){
  CE=c?{id:c.id,name:c.name,c:[...c.contains],m:[...c.may],none:false,mode:'c'}:{id:null,name:'',c:[],m:[],none:false,mode:'c'};
  openSheet({title:c?'Edit container':'New container',sub:c?'':'For a tub in the dry store or walk-in',body:`
    <div class="fld"><label class="fld-label" for="ce-name">Name — prints big</label><input class="inp inp-lg" id="ce-name" data-in="ce-name" value="${h(CE.name)}" placeholder="e.g. Plain Flour" autocomplete="off" autofocus></div>
    <div class="fld"><span class="fld-label">Allergens</span>${alEditorHTML('ce')}</div>
    <div class="lp"><div class="lp-cap"><b>Label</b><span>as it prints</span></div>${previewHTML('lp-ce',1)}</div>`,
    foot:`${c?`<button class="btn btn-danger" data-act="ce-del">${ico('trash')}Delete</button><span class="spacer"></span>`:''}<button class="btn" data-act="sheet-close">Cancel</button><button class="btn btn-primary" data-act="ce-save">${c?'Save':'Add container'}</button>`});
  cePreview();
}
const cePreview=debounce(()=>{if(CE)paintLabel($('#lp-ce'),{storage:true,product_name:titleCase(CE.name)||'Container name',date_prepped:ctDate(),contains:CE.c.join(', ')||null,may_contain:CE.m.join(', ')||null,printed_at:hhmm()});},60);
async function ceSave(){
  if(!CE)return;const name=titleCase(CE.name);
  if(!name){toast('Give it a name',{type:'err'});$('#ce-name')?.focus();return;}
  if(containers().some(x=>norm(x.name)===norm(name)&&String(x.id)!==String(CE.id))){toast(`There’s already a container called ${name}`,{type:'err'});return;}
  const body={name,category:CONTAINER,contains:CE.c.join(', ')||null,may_contain:CE.m.join(', ')||null,shelf_life_hours:72};
  try{
    if(CE.id!=null)await rest(CPS,'PATCH','products?id=eq.'+encodeURIComponent(CE.id),body,{prefer:'return=minimal'});
    else await rest(CPS,'POST','products',body,{prefer:'return=minimal'});
    alog(CE.id!=null?'Edited container':'Added container',name);
    const was=CE.id;closeSheet();await loadCPS();refreshTray();saveTray();
    toast(was!=null?`Saved ${name}`:`Added ${name}`);
  }catch(e){toast('Couldn’t save — '+e.message,{type:'err'});}
}
async function ceDelete(){
  const c=CE&&containers().find(x=>String(x.id)===String(CE.id));if(!c)return;
  try{
    await rest(CPS,'DELETE','products?id=eq.'+encodeURIComponent(c.id));
    closeSheet();alog('Deleted container',c.name);
    const tray=CT.tray;CT.tray=CT.tray.filter(t=>String(t.id)!==String(c.id));saveTray();
    await loadCPS();
    toast(`Deleted ${c.name}`,{action:'Undo',onAction:()=>once('undo-ct-'+c.id,async()=>{try{await rest(CPS,'POST','products',{name:c.name,category:CONTAINER,contains:c.contains.join(', ')||null,may_contain:c.may.join(', ')||null,shelf_life_hours:72},{prefer:'return=minimal'});await loadCPS();toast(`${c.name} is back`);}catch(e){toast('Couldn’t undo — '+e.message,{type:'err'});}})});
  }catch(e){toast('Couldn’t delete — '+e.message,{type:'err'});}
}
async function ctSeed(){
  const have=new Set(containers().map(c=>norm(c.name)));
  const rows=DRY_STORE.filter(([n])=>!have.has(norm(n))).map(([n,a])=>({name:n,category:CONTAINER,contains:a||null,may_contain:null,shelf_life_hours:72}));
  if(!rows.length){toast('They’re already there');return;}
  try{await rest(CPS,'POST','products',rows,{prefer:'return=minimal'});alog('Added containers',rows.map(r=>r.name).join(', '));await loadCPS();toast(`Added ${plural(rows.length,'container')}`);}
  catch(e){toast('Couldn’t add them — '+e.message,{type:'err'});}
}

/* Phone: the print button floats above the tab bar while there's something to print. */
function renderFloatBar(){
  let el=$('#float-bar');
  if(!el){el=document.createElement('div');el.id='float-bar';el.className='float-bar phone-only';document.body.appendChild(el);}
  let html='';
  if(S.user&&S.view==='plates'&&PL.queue.length)html=`<button class="btn btn-primary btn-lg btn-block" data-act="pl-print" ${PL.busy?'disabled':''}>${PL.busy?'<span class="spin"></span>Printing…':ico('printer')+'Print all '+plural(PL.queue.length,'plate label')}</button>`;

/* ═══════════════════════════════════════════════════════════════════════
   HISTORY — every label, newest first, with where it came from. Tap one
   to see the label itself and print it again (same batch, same dates).
   ═══════════════════════════════════════════════════════════════════════ */
const HI={rows:[],loaded:false,loading:false,error:null,q:'',filter:'all',limit:300,more:false};
function rowKind(r){
  if(r.label_type)return r.label_type;
  const n=String(r.product_name||'');
  if(r.section==='Plates'||/^Plate · /.test(n))return'plate';
  if(r.section==='Containers'||r.section==='Storage')return'container';
  if(/^\[Custom\]/.test(n))return'freeform';
  return'standard';
}
function rowSource(r){
  if(r.source)return r.source;
  const k=rowKind(r);if(k!=='standard')return k;
  const n=norm(r.product_name);
  if(kpNameSet().has(n)||/^(FRIDGE|FREEZER)$/.test(r.label_status||''))return'kitchen-prep';
  if(customProducts().some(p=>norm(p.name)===n))return'custom';
  return'one-off';
}
function rowWaiting(r){return/^(FRIDGE|FREEZER)$/.test(String(r.label_status||''));}
function rowDay(r){if(r.created_at){const d=new Date(r.created_at);if(!isNaN(d))return ymd(d);}return isYmd(r.date_prepped)?r.date_prepped:'';}
function rowTime(r){if(r.printed_at&&/^\d{1,2}:\d{2}/.test(r.printed_at))return String(r.printed_at).slice(0,5);if(r.created_at){const d=new Date(r.created_at);if(!isNaN(d))return hhmm(d);}return'';}
function rowName(r){const k=rowKind(r);const n=String(r.product_name||'');return k==='plate'?n.replace(/^Plate · /,''):k==='freeform'?n.replace(/^\[Custom\]\s*/,''):n;}
function rowKey(r){return r._pid?'p:'+r._pid:'r:'+r.id;}
function rowQty(r){const s=String(r.quantity??1).trim();return/^\d+$/.test(s)?parseInt(s):1;}
function qtyText(r){const s=String(r.quantity??1).trim();return/^\d+$/.test(s)?'×'+s:s;}
function rowBadges(r){
  const kind=rowKind(r),src=rowSource(r),b=[];
  if(kind==='plate')b.push(`<span class="badge">${ico('plate')}Plate</span>`);
  else if(kind==='container')b.push(`<span class="badge">${ico('box')}Container</span>`);
  else if(kind==='freeform')b.push('<span class="badge badge-one">Free text</span>');
  else if(src==='kitchen-prep')b.push(`<span class="badge badge-kp">${ico('lock')}Kitchen Prep</span>`);
  else if(src==='custom')b.push('<span class="badge badge-custom">Custom</span>');
  else b.push('<span class="badge badge-one">One-off</span>');
  const st=String(r.label_status||'').toUpperCase();
  if(st==='FROZEN'||st==='FREEZER')b.push(`<span class="badge badge-frz">${ico('snowflake')}Frozen</span>`);
  if(st==='THAWED')b.push(`<span class="badge badge-warn">${ico('drop')}Thawed</span>`);
  if(rowWaiting(r))b.push(`<span class="badge badge-warn">${ico('clock')}${rowDay(r)>=addDays(ymd(),-3)?'Waiting to print':'Never printed'}</span>`);
  if(st==='DISMISSED')b.push('<span class="badge">Not printed</span>');
  if(r.allergens_edited)b.push(`<span class="badge badge-warn">${ico('pencil')}Allergens edited</span>`);
  if(r._pending)b.push(`<span class="badge">${ico('clock')}Not uploaded yet</span>`);
  return b.join('');
}
function rowPayload(r){
  const kind=rowKind(r);
  if(kind==='plate'){const m=/^T(\S*) P(\S*)(?: · (.*))?$/.exec(r.notes||'')||[];return{plate:true,guest_name:rowName(r),table:m[1]||'',position:m[2]||'',dietary:r.contains||'',dish:m[3]||'',urgency:String(r.label_status||'allergy').toLowerCase(),printed_at:rowTime(r)};}
  if(kind==='container')return{storage:true,product_name:r.product_name,date_prepped:r.date_prepped,contains:r.contains,may_contain:r.may_contain,notes:r.notes,printed_at:rowTime(r)};
  if(rowWaiting(r))return inboxPayload(r);
  const st=String(r.label_status||'').toUpperCase(),src=rowSource(r);
  const note=r.source?({'kitchen-prep':'Kitchen Prep',custom:'Custom','one-off':'One-off'}[src]||'')+(r.allergens_edited?' · allergens edited':''):'';
  return{product_name:rowName(r),job_code:r.job_code,date_prepped:r.date_prepped,date_useby:r.date_useby,staff_name:r.staff_name,section:r.section,contains:r.contains,may_contain:r.may_contain,
    notes:kind==='freeform'?null:r.notes,printed_at:rowTime(r),status:st==='FROZEN'||st==='THAWED'?st:'',status_date:r.status_date,weight_display:r.weight_display,source_note:note};
}
function renderHistory(){
  $('#view-history').innerHTML=`<div class="ph"><div class="ph-title">History<div class="ph-sub">Every label printed, newest first</div></div>
    <div class="ph-acts"><button class="btn btn-sm" data-act="hi-refresh" aria-label="Refresh">${ico('refresh')}<span class="desk-only">Refresh</span></button><button class="btn btn-sm" data-act="hi-csv">${ico('download')}Export</button></div></div>
    <div class="bar"><div class="search" style="flex:1 1 220px;max-width:440px">${ico('search')}<input class="inp" id="hq" type="search" placeholder="Search product, job or who" data-in="hi-q" value="${h(HI.q)}" autocomplete="off" aria-label="Search history"></div>${seg([['all','All'],['today','Today'],['mine','Mine']],HI.filter,'hi-filter')}</div>
    <div class="body" id="hi-list"></div>`;
  renderHiList();loadHistory();
}
async function loadHistory(){
  if(HI.loading)return;HI.loading=true;if(!HI.loaded)renderHiList();
  try{HI.rows=await rest(CPS,'GET',`print_jobs?select=*&order=created_at.desc&limit=${HI.limit}`)||[];HI.error=null;HI.more=HI.rows.length>=HI.limit;}
  catch(e){HI.error=e.message;}
  HI.loading=false;HI.loaded=true;renderHiList();
}
function hiAllRows(){
  const pend=S.pendingRecords.map(p=>({...p.rec,created_at:new Date(p.at).toISOString(),_pending:true,_pid:p.pid||String(p.at)}));
  return[...pend,...HI.rows];
}
function hiFind(key){return hiAllRows().find(r=>rowKey(r)===key)||null;}
function hiFiltered(){
  const q=norm(HI.q),words=q.split(' ').filter(Boolean),today=ymd(),me=norm(S.user&&S.user.name);
  return hiAllRows().filter(r=>{
    if(HI.filter==='today'&&rowDay(r)!==today)return false;
    if(HI.filter==='mine'&&norm(r.staff_name)!==me)return false;
    if(words.length){const hay=norm([r.product_name,r.job_code,r.staff_name,r.section,r.contains,r.notes,dayWords(rowDay(r))].join(' '));if(!words.every(w=>hay.includes(w)))return false;}
    return true;
  });
}
function renderHiList(){
  const el=$('#hi-list');if(!el)return;
  if(!HI.loaded&&!S.pendingRecords.length){el.innerHTML=`<div class="group">${Array.from({length:7},()=>'<div class="row"><div class="skel" style="height:34px;width:100%"></div></div>').join('')}</div>`;return;}
  if(HI.error&&!HI.rows.length){el.innerHTML=`<div class="empty">${ico('warning')}<div class="empty-t">Can’t load History</div><div class="empty-s">${h(HI.error)}</div><button class="btn" data-act="hi-refresh">${ico('refresh')}Try again</button></div>`;return;}
  const list=hiFiltered();
  if(!list.length){el.innerHTML=`<div class="empty">${ico('clock')}<div class="empty-t">${HI.q||HI.filter!=='all'?'Nothing matches':'Nothing printed yet'}</div><div class="empty-s">${HI.q||HI.filter!=='all'?'Try All, or a different search.':'Labels appear here as they print.'}</div></div>`;return;}
  const days=[];list.forEach(r=>{const d=rowDay(r);let g=days.find(x=>x.d===d);if(!g){g={d,rows:[]};days.push(g);}g.rows.push(r);});
  el.innerHTML=days.map(g=>{const n=g.rows.reduce((a,r)=>a+rowQty(r),0);return`<div class="hday"><span>${h(g.d?dayWords(g.d):'Earlier')}</span><span class="n">${plural(n,'label')}</span></div>
    <div class="group">${g.rows.map(hiRowHTML).join('')}</div>`;}).join('')
    +(HI.more?`<div style="text-align:center;padding:18px"><button class="btn" data-act="hi-more">Show older labels</button></div>`:'');
}
function hiRowHTML(r){

    PL.queue.push({id:uid(),name:p.guest_name,table:p.table,pos:p.position,urgency:u,dietary:p.dietary,dish:p.dish,course:p.dish?dishCourse(p.dish):90,job:r.job_code||null,eventId:null});

async function prUpdate(){
  if(!await askConfirm('Printing pauses for about 20 seconds while the print server restarts.',{title:'Update the print server?',ok:'Update',danger:false}))return;
  const from=(S.printer.info||{}).version;
  try{await piCall('POST','/update',null,15000);}catch(e){toast('Couldn’t start the update — '+e.message,{type:'err'});return;}
  toast('Updating the print server…',{type:'busy',ms:130000});
  const t0=Date.now();
  while(Date.now()-t0<120000){
    await sleep(4000);const p=await checkPrinter();const v=p.info&&p.info.version;
    if(v&&v!==from){alog('Updated print server',(from||'?')+' → '+v);toast(`Print server updated to ${v}`);renderMgPrinter();return;}
  }
  toast('The update is taking longer than usual — tap Check in a minute',{type:'err'});
}
async function prSaveUrl(){

  try{new URL(u);}catch(e){toast('That doesn’t look like an address',{type:'err'});return;}
  u=u.replace(/\/(print|status|butchery\/label)?\/*$/,'');
  try{
    const rows=await rest(KP,'PATCH','app_settings?key=eq.butchery_printer_url',{value:u},{prefer:'return=representation'});
    if(!rows||!rows.length)await rest(KP,'POST','app_settings',{key:'butchery_printer_url',value:u},{prefer:'return=minimal'});
    S.kp.settings.butchery_printer_url=u;alog('Changed printer address',u);

  }catch(e){toast('Couldn’t save it in Kitchen Prep — '+e.message,{type:'err'});}
}

const NAV=[['print','printer','Print'],['plates','plate','Plates'],['containers','box','Containers'],['history','clock','History'],['manage','sliders','Manage']];
function navBadge(id,tab){
  if(id==='print'&&S.outbox.length)return`<span class="nav-n" title="Didn’t print">${S.outbox.length}</span>`;
  if(id==='print'&&S.inbox.length)return`<span class="nav-n kp" title="Sent from Kitchen Prep">${S.inbox.length}</span>`;
  if(tab)return'';
  if(id==='plates'&&PL.queue.length)return`<span class="nav-n soft">${PL.queue.length}</span>`;
  if(id==='containers'&&CT.tray.length)return`<span class="nav-n soft">${trayCount()}</span>`;
  return'';
}
function renderNav(){
  $('#sb-nav').innerHTML=NAV.map(([id,icon,label])=>`<button class="nav-item${S.view===id?' on':''}" data-act="go" data-to="${id}" ${S.view===id?'aria-current="page"':''}>${ico(icon)}<span>${label}</span>${navBadge(id)}</button>`).join('');
  $('#tabbar').innerHTML=NAV.map(([id,icon,label])=>`<button class="tab${S.view===id?' on':''}" data-act="go" data-to="${id}" ${S.view===id?'aria-current="page"':''}>${ico(icon)}<span>${label}</span>${navBadge(id,true)}</button>`).join('');
  if(S.user)$('#sb-user').innerHTML=`${avatarHTML(S.user)}<span class="grow"><span>${h(S.user.name)}</span><span class="sub">Switch user</span></span>`;
}
function updateBadges(){if(S.user)renderNav();}
function go(to){const target='#'+to;if(location.hash===target)route();else location.hash=target;}
const VIEWS={print:()=>renderPrintView(),plates:()=>renderPlates(),containers:()=>renderContainers(),history:()=>renderHistory(),manage:sub=>renderManage(sub)};
function route(){
  if(!S.user)return;
  const [view,sub]=(location.hash||'#print').slice(1).split('/');
  const v=VIEWS[view]?view:'print';
  if(Sheet.open)closeSheet();if(_confirm)resolveConfirm(false);
  S.view=v;
  $$('.view').forEach(el=>el.classList.toggle('on',el.id==='view-'+v));
  renderNav();VIEWS[v](sub);renderFloatBar();setToastLift();
  if(v==='print'){loadInbox();if(Date.now()-S.kp.at>60000)loadKP();}
}
window.addEventListener('hashchange',route);

/* ── Data changed → redraw only what shows it (never the field you're typing in) ── */
onData('any',kind=>{
  if(!S.user)return;
  if(kind==='printer'){
    if(S.view==='manage'){if(MG.page==='printer')renderMgPrinter();renderMgList();}
    if(S.view==='print'&&W&&W.step==='review')renderStepFoot();
    return;
  }
  if(kind==='inbox'){updateBadges();if(S.view==='print'&&W&&W.step==='product')renderInbox();return;}
  if(kind==='history'){if(S.view==='history')renderHiList();return;}
  if(S.view==='print'&&W){
    if(W.prod&&W.prod.src!=='oneoff'&&!W.al.unlocked&&!W.reprint){const fresh=productByKey(W.prod.key);if(fresh){const was=W.prod;W.prod=fresh;W.al.c=[...fresh.contains];W.al.m=[...fresh.may];if(!W.usebyManual&&was.shelfHours!==fresh.shelfHours){recalcUseby();const d=$('#rv-dates');if(d)d.innerHTML=datesHTML();}if(W.step==='review'&&(!sameSet(was.contains,fresh.contains)||!sameSet(was.may,fresh.may))){const a=$('#rv-al');if(a)a.innerHTML=reviewAllergensHTML();toast(`Kitchen Prep just updated the allergens for ${fresh.name}`,{type:'err',ms:6000});}}}
    if(W.job&&W.job.code){const j=jobByCode(W.job.code);if(j)W.job=j;}
    renderPrintBanner();
    if(W.step==='product'){renderProducts();renderInbox();}else if(W.step==='job')renderJobs();
    renderSideSummary();schedulePreview();
  }
  if(S.view==='plates'&&!document.activeElement?.closest('#pl-form')){renderPlForm();}
  if(S.view==='containers'){refreshTray();renderCtMain();renderCtSide();}
  if(S.view==='manage'){renderMgList();if(MG.page==='products')renderMgPList();else if(['containers','jobs'].includes(MG.page))renderMgPage();}
  if(S.view==='history')renderHiList();
});

function updateLabelsUI(){
  const n=$('#lbl-n');if(n)n.innerHTML=`${W.labels}<small>${W.labels===1?'label':'labels'}</small>`;
  const minus=$('[data-act=wiz-labels][data-d="-1"]'),plus=$('[data-act=wiz-labels][data-d="1"]');
  if(minus)minus.disabled=W.labels<=1;if(plus)plus.disabled=W.labels>=50;
  const pb=$('#print-btn');if(pb&&W.statusChosen)pb.innerHTML=`${ico('printer')}<span>Print ${plural(W.labels,'label')}</span>`;
  const sn=$('#side-n');if(sn)sn.textContent=W.labels>1?`×${W.labels} labels`:'';
  $$('#side-prev .lp-paper, .rv .lp-paper').forEach(p=>p.classList.toggle('stack',W.labels>1));
}
function updateTrayRow(key){
  const t=CT.tray.find(x=>x.key===key);if(!t){renderCtMain();renderCtSide();return;}
  const b=$(`[data-act=ct-inc][data-key="${CSS.escape(key)}"]`);if(!b){renderCtSide();return;}
  const row=b.closest('.tray-row');row.querySelector('.stepper-n').textContent=t.count;b.disabled=t.count>=50;
  const c=t.id!=null&&$('#cnt-'+CSS.escape(String(t.id)));if(c)c.textContent=t.count;
  const hd=$('#ct-side .group-hd .n');if(hd)hd.textContent=plural(trayCount(),'label');
  const pb=$('#ct-side [data-act=ct-print]');if(pb&&!CT.busy)pb.innerHTML=ico('printer')+'Print '+plural(trayCount(),'label');
  renderFloatBar();
}
async function printInboxRow(r){
  return once('ib-'+r.id,async()=>{
    const p=productByName(r.product_name);let fresh=null;
    if(p&&p.src==='kp'){
      fresh=await freshKpProduct(p);
      if(fresh&&fresh.gone){loadKP();toast(`${r.product_name} is no longer in Kitchen Prep — not printed. Dismiss it, or print it as a one-off.`,{type:'err'});return{ok:false};}
      if(fresh&&(!sameSet(fresh.contains,p.contains)||!sameSet(fresh.may,p.may)))loadKP();
    }
    const pl=inboxPayload(r,fresh);
    if(pl.date_useby&&pl.date_useby<ymd()){toast(`${r.product_name}: its use-by (${dayWords(pl.date_useby)}) has passed — not printed.`,{type:'err'});return{ok:false};}
    toast(`Printing ${plural(pl.quantity,'label')} — ${r.product_name}`,{type:'busy'});
    const res=await sendToPrinter({...pl,job_id:'ib-'+r.id});
    if(res.ok){await markInboxPrinted(r);alog('Printed from Kitchen Prep',`${pl.quantity}× ${r.product_name}`);toast(`Sent ${plural(pl.quantity,'label')} — ${r.product_name}`);}
    else toast(res.timeout?`${r.product_name}: the printer didn’t answer in time — check it before trying again`:`${r.product_name} didn’t print — ${res.error}`,{type:'err',ms:6000});
    return res;
  });
}
async function onPrinterBack(){
  const due=S.outbox.filter(o=>o.unreachable&&!o.maybePrinted&&!o.stale&&Date.now()-o.at<30*60e3);
  if(!due.length)return;
  await once('auto-resend',async()=>{for(const it of [...due].reverse()){const r=await sendChecked({...it,payload:{...it.payload,printed_at:hhmm()}});if(r&&r.busy)continue;if(!r||!r.ok)break;}});
  renderPrintBanner();
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el._skipClick){el._skipClick=false;return;}
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.tagName==='A'&&!el.getAttribute('href'))e.preventDefault();
  fn(el,e);
});
$('#ovc').addEventListener('click',e=>{if(e.target.id==='ovc')resolveConfirm(false);});
/* Press and hold a − / + to keep counting. */
let _holdT=null;
function stopHold(){clearTimeout(_holdT);clearInterval(_holdT);_holdT=null;}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-hold]');if(!el||el.disabled||(e.button!==undefined&&e.button>0))return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  fn(el,e);el._skipClick=true;stopHold();
  _holdT=setTimeout(()=>{_holdT=setInterval(()=>{if(!document.contains(el)||el.disabled){stopHold();return;}fn(el,e);},90);},420);
});
['pointerup','pointercancel','pointerleave','blur'].forEach(t=>document.addEventListener(t,stopHold,true));

/* ── Typing ───────────────────────────────────────────────────────────── */
const IN={
  'wiz-q':el=>{W.q=el.value;const x=$('.search-x');if(x)x.toggleAttribute('hidden',!W.q);renderProducts();const b=$('#step-body');if(b)b.scrollTop=0;},
  'wiz-jq':()=>renderJobs(),
  'wiz-notes':el=>{W.notes=el.value;schedulePreview();},
  'wiz-w':el=>{W[el.dataset.k]=el.value;schedulePreview();},
  'pl-f':el=>{PL[el.dataset.k]=el.value;if(el.dataset.k==='dish'){const b=$('#pl-add span');if(b)b.textContent=plAddText();}if(el.dataset.k==='name')plNameWarn();plPreview();},
  'ce-name':el=>{CE.name=el.value;cePreview();},
  'cp-name':el=>{CP.name=el.value;},
  'cp-hours':el=>{const v=parseInt(el.value);if(v>0){CP.hours=v;$$('#cp-life .chip').forEach(c=>c.classList.toggle('on',+c.dataset.v===v));}},
  'jc':el=>{JC[el.dataset.k]=el.value;$('#jc-out').textContent=jcCode();},
  'sf':el=>{SF[el.dataset.k]=el.value;},
  'hi-q':el=>{HI.q=el.value;renderHiList();},
  'mg-pq':el=>{MG.pq=el.value;renderMgPList();}
};
const CH={
  'wiz-date':el=>{const k=el.dataset.k;const v=el.value;if(!isYmd(v))return;W[k]=v;if(k==='useby')W.usebyManual=v!==autoUseby();else if(!W.usebyManual)recalcUseby();refreshReviewBits();},
  'wiz-save':el=>{W.saveProduct=el.checked;},
  'ct-date':el=>{if(isYmd(el.value)){setCtDate(el.value);const p=$('#ct-date-pill');if(p)p.innerHTML=ctDateHTML();renderCtSide();}},
  'jc':el=>{JC[el.dataset.k]=el.value;$('#jc-out').textContent=jcCode();}
};
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e);});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e);});

/* ── Keyboard ─────────────────────────────────────────────────────────── */
document.addEventListener('keydown',e=>{
  if(!S.user){if(!$('#login').hidden)loginKey(e);return;}
  if(e.key==='Escape'){
    if($('#ovc').classList.contains('open')){resolveConfirm(false);return;}
    if(Sheet.open){closeSheet();return;}
    if(S.view==='print'){const a=document.activeElement;if(a&&a.id==='q'&&W.q){W.q='';a.value='';renderProducts();$('.search-x')?.setAttribute('hidden','');return;}wizBack();}
    return;
  }
  if(topOverlay()){if(e.key==='Enter'&&document.activeElement&&document.activeElement.id==='qty-other'){e.preventDefault();ACT['wiz-labels-other']();}return;}
  const a=document.activeElement;const typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if(e.key==='/'&&!typing&&S.view==='print'&&W.step==='product'){e.preventDefault();$('#q')?.focus();return;}
  if(S.view==='print'&&W.step==='review'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey||(!typing&&!(a&&a.closest('button,a,summary'))))){e.preventDefault();ACT['wiz-print']();return;}
  if(S.view==='print'&&W.step==='product'&&e.key==='Enter'&&a&&a.id==='q'&&W.q){
    e.preventDefault();const first=$('#prod-results .tile')||$('#prod-results .oneoff-row');if(first)first.click();return;
  }
  if(S.view==='plates'&&e.key==='Enter'&&a&&a.closest('#pl-form')&&a.tagName==='INPUT'){e.preventDefault();plAdd();}
});

/* ── Didn't print ─────────────────────────────────────────────────────── */
function outboxSheet(){
  if(!S.outbox.length){closeSheet();return;}
  openSheet({title:'Didn’t print',sub:'Kept here until they print or you discard them',body:`<div class="group">${S.outbox.map(o=>`<div class="q-item"><div class="q-main"><div class="q-t">${h(o.title)} <span class="muted" style="font-weight:500">×${o.payload.quantity||1}</span></div>
      <div class="q-s">${o.payload.job_code?`<span class="mono">${h(o.payload.job_code)}</span> · `:''}${h(new Date(o.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}))}${o.tries>1?' · tried '+o.tries+' times':''}</div>
      <div class="q-err">${h(o.error||'')}${o.maybePrinted?' — it may have printed; check before retrying':''}</div></div>
      <div class="inline" style="flex-wrap:nowrap"><button class="btn btn-sm" data-act="ob-discard" data-id="${h(o.id)}">Discard</button><button class="btn btn-sm btn-primary" data-act="ob-retry" data-id="${h(o.id)}">${o.stale?'Check':'Retry'}</button></div></div>`).join('')}</div>`,
    foot:`<button class="btn" data-act="sheet-close">Close</button><button class="btn btn-primary" data-act="outbox-retry-all">${ico('printer')}Retry all</button>`});
}
async function retryOutbox(id){
  return once('ob-'+id,async()=>{
    const it=S.outbox.find(o=>o.id===id);if(!it)return;
    if(it.stale){await checkStale(it);return;}
    const res=await sendChecked({...it,payload:{...it.payload,printed_at:hhmm()}});
    renderPrintBanner();if(Sheet.open)outboxSheet();
    return res;
  });
}
/* Kitchen Prep changed its allergens after this was sent: open it with the new ones. */
async function checkStale(it){
  closeSheet();await loadKP();
  // Kitchen Prep reloaded: its product now. If it didn't answer: what it sent when the change was spotted.
  const p=S.kp.ok?productByKey(it.base&&it.base.key):it.fresh;
  if(!p){toast(S.kp.ok?`${it.title} is no longer in Kitchen Prep — discard it`:'Kitchen Prep isn’t answering — try again in a moment',{type:'err'});return;}
  removeFromOutbox(it.id);renderPrintBanner();reopenItem(it,p);
}
async function retryAllOutbox(){
  const todo=S.outbox.filter(o=>!o.stale);
  if(!todo.length){if(S.outbox.length)await checkStale(S.outbox[0]);return;}
  for(const it of [...todo].reverse()){
    const res=await sendChecked({...it,payload:{...it.payload,printed_at:hhmm()}});
    if(res&&res.busy)continue;
    if(!res||!res.ok)break;
  }
  renderPrintBanner();if(Sheet.open)outboxSheet();
}

/* ── Boot ─────────────────────────────────────────────────────────────── */
let _kpTimer=null,_ibTimer=null;
function enterApp(){
  $('#login').hidden=true;$('#app').hidden=false;
  if(!W)W=freshW();
  renderNav();renderPrinterPill();
  if(!location.hash||location.hash==='#')history.replaceState(null,'','#print');
  route();
  loadKP();loadCPS();probeExt();startPrinterPolling();flushRecords();loadLabelFonts();loadInbox();
  clearInterval(_kpTimer);_kpTimer=setInterval(()=>{if(!document.hidden&&S.user){loadKP();loadCPS();flushRecords();}},3*60*1000);
  clearInterval(_ibTimer);_ibTimer=setInterval(()=>{if(!document.hidden&&S.user)loadInbox();},30000);
}
function boot(){
  const c=LS.get('dcps_cps_cache',null);if(c){S.cps.products=c.products||[];S.cps.jobs=c.jobs||[];S.cps.at=c.at||0;}
  const k=kpCache();if(k)try{applyKp(k.dishes,k.events,k.settings,k.at);}catch(e){}
  if(restoreSession()){
    enterApp();
    loadStaff().then(()=>{const s=S.staff.find(x=>String(x.id)===String(S.user.id));if(!s){signOut();return;}S.user={id:s.id,name:s.name,color:s.color,initials:s.initials};renderNav();}).catch(()=>{});
  }else showLogin();
}
boot();

</script>
